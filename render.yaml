# Render Blueprint: API (server/) + public static site (Vite dist/).
# In the deploy UI: set OPENAI_API_KEY (secret) and VITE_AI_API_BASE = your API URL (https://codequest-ai-....onrender.com, no trailing slash).
# Optionally on the API service set CORS_ORIGIN to your static site URL once you know it (or use * for testing).
services:
  - type: web
    name: codequest-ai
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGIN
        value: "*"
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: codequest-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AI_API_BASE
        sync: false
